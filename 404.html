<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Lunaria</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --crema: #fffcf4;
      --tinta: #0e0e10;
      --lima: #dfff3b;
      --coral: #ff5b3a;
      --display: "Archivo Black", "Arial Black", Impact, sans-serif;
      --ui: "Manrope", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--crema);
      color: var(--tinta);
      font-family: var(--ui);
      padding: 24px;
      text-align: center;
    }
    .caja {
      max-width: 620px;
      border: 2px solid var(--tinta);
      border-radius: 28px;
      background: #fff;
      padding: clamp(28px, 6vw, 56px);
      box-shadow: 10px 10px 0 var(--lima);
    }
    .marca {
      font-family: var(--display);
      letter-spacing: 0.16em;
      font-size: 1.1rem;
      margin-bottom: 24px;
    }
    .marca::after {
      content: "";
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-left: 6px;
      border-radius: 50%;
      background: var(--lima);
      border: 2px solid var(--tinta);
    }
    .codigo {
      font-family: var(--display);
      font-size: clamp(4.5rem, 18vw, 8rem);
      line-height: 0.85;
      color: var(--tinta);
      margin: 0;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(1.4rem, 4vw, 2rem);
      text-transform: uppercase;
      line-height: 1;
      margin: 12px 0 12px;
    }
    p { color: #34322d; font-weight: 500; margin: 0 0 26px; }
    .acciones { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a.boton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 28px;
      border: 2px solid var(--tinta);
      border-radius: 999px;
      background: var(--lima);
      color: var(--tinta);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 6px 6px 0 var(--tinta);
    }
    a.boton--secundario {
      background: #fff;
      box-shadow: none;
    }
    a.boton:hover { background: var(--tinta); color: var(--crema); }
    small {
      display: block;
      margin-top: 24px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #7a7468;
    }
  </style>
</head>
<body>
  <div class="caja">
    <div class="marca">LUNARIA</div>
    <p class="codigo">404</p>
    <h1>Este par no está en la estantería</h1>
    <p>La página que buscas no existe o cambió de lugar.
       Vuelve al inicio y sigue mirando el drop.</p>
    <div class="acciones">
      <a class="boton" href="#" id="inicio">Ir al inicio</a>
      <a class="boton boton--secundario" href="#" id="tienda">Ver la tienda</a>
    </div>
    <small>Si llegaste desde un enlace antiguo, escríbenos por WhatsApp y te ayudamos.</small>
  </div>

  <script>
    // Calcula la raíz del sitio tanto en usuario.github.io como en usuario.github.io/repositorio
    (function () {
      var partes = location.pathname.split("/").filter(Boolean);
      var esGitHub = /\.github\.io$/i.test(location.hostname);
      var base = "/";
      // En usuario.github.io/repositorio/... la raíz es /repositorio/
      if (esGitHub && partes.length > 1) {
        base = "/" + partes[0] + "/";
      }
      document.getElementById("inicio").href = base;
      document.getElementById("tienda").href = base + "tienda.html";
    })();
  </script>
</body>
</html>
