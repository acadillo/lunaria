name: Publicar en GitHub Pages

# Se ejecuta al subir cambios a main, o a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita Pages automáticamente si aún no está activo
          enablement: true

      - name: Copiar solo los archivos del sitio
        run: |
          mkdir -p _site
          cp -R assets _site/
          cp ./*.html _site/
          touch _site/.nojekyll
          echo "Archivos publicados:"
          find _site -type f | wc -l

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
